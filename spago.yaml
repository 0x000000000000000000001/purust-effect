package:
  name: effect
  dependencies:
    - prelude
  test:
    main: Test.Main
    dependencies:
      - assert
      - console
      - refs
workspace:
  backend:
    cmd: ../purust/bin/purust
    args: [--main, Test.Main, --source, output, --out, output/purust_output]
  packageSet:
    registry: 77.7.0
  extraPackages:
    assert:
      path: ../purust-assert
    console:
      path: ../purust-console
    prelude:
      path: ../purust-prelude
    refs:
      path: ../purust-refs
